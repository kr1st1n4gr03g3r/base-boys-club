

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
 <body>

  <h1>Pitch by Pitch Report</h1>

  <table id="pitch-table" border="1">

    <thead>

      <tr>

        <th>⚾️ Batter</th>

        <th>✋🏻 Bat</th>

        <th>#️⃣ Player</th>

        <th>🏟️ Pos.</th>

        <th>Inning</th>

        <th>Result</th>

      </tr>

    </thead>

    <tbody>

      <tr>

        <td>{{ batter }}</td>

        <td>{{ bat_side }}</td>

        <td>{{ player_number }}</td>

        <td>{{ position }}</td>

        <td>{{ inning }}</td>

        <td>{{ result }}</td>

      </tr>

    </tbody>

  </table>

</body>

</html>
